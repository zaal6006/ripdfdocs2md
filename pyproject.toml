[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripdfdocs2md"
version = "0.1.0"
description = "Local, offline PDF/DOCX/DOC to Markdown converter for feeding an internal chatbot AI."
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "mammoth>=1.7.0",
    "markdownify>=0.13.0",
    "wordninja-enhanced>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
ripdfdocs2md = "ripdfdocs2md.cli:main"
ripdfdocs2md-verify = "ripdfdocs2md.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
